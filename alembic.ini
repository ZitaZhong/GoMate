# Alembic config. DB URL is injected in migrations/env.py from WTG_ env vars (isolated instance).
# NOTE: keep this file ASCII-only (Alembic reads it with the OS locale codec, GBK on zh-Windows).
[alembic]
script_location = migrations
prepend_sys_path = src
# sqlalchemy.url is intentionally empty; real value set in env.py via get_settings().sync_db_url
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
